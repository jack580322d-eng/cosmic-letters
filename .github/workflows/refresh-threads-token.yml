name: refresh-threads-token
# Threads 長效權杖約 60 天到期；每月 1 號自動換新，並寫回 THREADS_ACCESS_TOKEN。
# 需要一個 secret：GH_PAT（只開這個 repo 的 Secrets: Read and write 權限的 fine-grained token）。
on:
  schedule:
    - cron: "23 3 1 * *"   # 每月 1 號 11:23（台北時間）
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and store
        env:
          OLD: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::還沒設定 GH_PAT，無法把新權杖寫回 secrets。請照 README 建立後再跑。"
            exit 1
          fi
          RESP=$(curl -sS "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=$OLD")
          NEW=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$NEW" ]; then
            echo "::error::換新失敗：$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('error',{}).get('message','unknown'))")"
            exit 1
          fi
          echo "::add-mask::$NEW"
          gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
          echo "Threads 權杖已換新，有效期約 60 天。"
